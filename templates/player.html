{% extends 'base.html' %}

{% block body %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/video_page.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-body text-center">
                    <video class="w-100" controls>
                        <source src="{{ url_for('serve_video', class_number=class_number, video_name=video_name) }}" type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <div>
                        <p>{{ video_name }}</p>
                        <div class="d-inline-flex gap-2">
                            <button class="btn btn-outline-success like_btn" id="like-{{ video_name }}">
                                👍 <span class="like_count">{{ like_count }}</span>
                            </button>
                            <button class="btn btn-outline-danger dislike_btn" id="dislike-{{ video_name }}">
                                👎 <span class="dislike_count">{{ dislike_count }}</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelector('.like_btn').onclick = async function() {
        let like_btn = this;
        let like_count = like_btn.querySelector('.like_count');
        await fetch('/' + like_btn.id.split('-')[1] + '/like', { method: 'POST' });
        like_count.innerText = Number(like_count.innerText) + 1;
    }

    document.querySelector('.dislike_btn').onclick = async function() {
        let dislike_btn = this;
        let dislike_count = dislike_btn.querySelector('.dislike_count');
        await fetch('/' + dislike_btn.id.split('-')[1] + '/dislike', { method: 'POST' });
        dislike_count.innerText = Number(dislike_count.innerText) + 1;
    }
</script>
{% endblock %}
