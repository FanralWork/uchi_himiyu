{% extends 'base.html' %}
{% block body %}
    <div class="container">
        <h1 class="text-center mt-5">Добро пожаловать на сайт видеоуроков "Учи химию"</h1>
        <p class="text-center">Выберите класс:</p>
        <div class="d-flex justify-content-center">
            <select id="classSelect" class="form-select w-50" onchange="loadVideos()">
                <option value="" selected>Выберите класс</option>
                <option value="8">8 класс</option>
                <option value="9">9 класс</option>
                <option value="10">10 класс</option>
                <option value="11">11 класс</option>
            </select>
        </div>
        <div id="videoContainer" class="row mt-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
