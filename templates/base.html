<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учи химию - сайт видеоуроков</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.jpg') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-md-3 mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img  class="bi" width="50" height="50" src="{{ url_for('static', filename='logo.jpg') }}"><use xlink:href="/"></use></img>
        </a>
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="nav-link px-2 link-secondary">Домой</a></li>
        <li><a href="/info" class="nav-link px-2">Информация</a></li>
        <li><a href="/contacts" class="nav-link px-2">Контакты</a></li>
      </ul>

      <div class="col-md-3 text-end">
        <a type="button" href = "/upload" class="btn btn-primary">Загрузить</a>
      </div>
    </header>
</div>
<body>
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
<div class="container">
  <footer class="py-3 my-4">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
      </ul>
    <p class="text-center text-body-secondary">© 2024 "Учи химию", автор - Фомичев Дмитрий</p>
  </footer>
</div>
</html>
